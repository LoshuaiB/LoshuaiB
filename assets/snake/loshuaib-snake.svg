<svg viewBox="-16 -32 880 192" width="880" height="192" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">LoshuaiB snake animation</title>
  <desc id="description">A purple snake crosses a GitHub-style grid and eats green cells spelling LoshuaiB.</desc>
  <style>
    :root {
      --cb: #1b1f230a;
      --cs: purple;
      --ce: #ebedf0;
      --c1: #9be9a8;
      --c2: #40c463;
      --c3: #30a14e;
      --c4: #216e39;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ce: #161b22;
        --c1: #01311f;
        --c2: #034525;
        --c3: #0f6d31;
        --c4: #00c647;
      }
    }
    .cell,
    .food,
    .score,
    .snake {
      shape-rendering: geometricPrecision;
    }
    .cell {
      fill: var(--ce);
      stroke: var(--cb);
      stroke-width: 1px;
    }
    .food {
      stroke: var(--cb);
      stroke-width: 1px;
    }
    .l1 { fill: var(--c1); }
    .l2 { fill: var(--c2); }
    .l3 { fill: var(--c3); }
    .l4 { fill: var(--c4); }
    .snake { fill: var(--cs); }
  </style>

  <defs>
    <rect id="cell" x="2" y="2" width="12" height="12" rx="2" ry="2"/>
    <g id="column">
      <use href="#cell" class="cell" y="0"/>
      <use href="#cell" class="cell" y="16"/>
      <use href="#cell" class="cell" y="32"/>
      <use href="#cell" class="cell" y="48"/>
      <use href="#cell" class="cell" y="64"/>
      <use href="#cell" class="cell" y="80"/>
      <use href="#cell" class="cell" y="96"/>
    </g>

    <!-- 337 sixteen-pixel steps: one entry step, seven 47-cell rows, and eight exit steps. -->
    <path id="head-route" pathLength="1" d="M48-16V0H784V16H48V32H784V48H48V64H784V80H48V96H912"/>
    <path id="body-route-1" pathLength="1" d="M48-32V0H784V16H48V32H784V48H48V64H784V80H48V96H896"/>
    <path id="body-route-2" pathLength="1" d="M48-48V0H784V16H48V32H784V48H48V64H784V80H48V96H880"/>
    <path id="body-route-3" pathLength="1" d="M48-64V0H784V16H48V32H784V48H48V64H784V80H48V96H864"/>

    <mask id="food-mask" maskUnits="userSpaceOnUse" x="-16" y="-32" width="880" height="192">
      <rect x="-16" y="-32" width="880" height="192" fill="#fff"/>
      <use href="#head-route" transform="translate(8 8)" fill="none" stroke="#000" stroke-width="14.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" dur="34300ms" repeatCount="indefinite" calcMode="linear" values="1;1;0" keyTimes="0;.017493;1"/>
      </use>
    </mask>

    <clipPath id="score-clip" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="144" width="0" height="12">
        <animate attributeName="width" dur="34300ms" repeatCount="indefinite" calcMode="linear"
          values="0;0;53;174.143;280.143;431.572;530;636;848;848"
          keyTimes="0;.020408;.154519;.291545;.428571;.565598;.702624;.839650;.976676;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- The fixed 53-by-7 GitHub contribution grid. -->
