    <rect class="score l1" x="0" y="144" width="53" height="12"/>
    <rect class="score l2" x="53" y="144" width="121.143" height="12"/>
    <rect class="score l3" x="174.143" y="144" width="106" height="12"/>
    <rect class="score l4" x="280.143" y="144" width="151.429" height="12"/>
    <rect class="score l3" x="431.572" y="144" width="98.428" height="12"/>
    <rect class="score l2" x="530" y="144" width="106" height="12"/>
    <rect class="score l1" x="636" y="144" width="212" height="12"/>
  </g>

  <!-- Four original-size snk segments, each one grid step behind the previous segment. -->
  <g aria-hidden="true">
    <rect class="snake" x="0.8" y="0.8" width="14.4" height="14.4" rx="4.5" ry="4.5">
      <animateMotion dur="34300ms" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1" keyTimes="0;.017493;1">
        <mpath href="#head-route"/>
